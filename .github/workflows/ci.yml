name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --locked --all-groups
      - run: uv run ruff check backend
      - run: uv run mypy backend
      - run: uv run pip-audit --skip-editable
      - run: uv run pytest
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: npm --prefix frontend audit --audit-level=high
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: docker compose exec -T api python -m backend.app.scripts.seed
      - run: docker compose exec -T api python -m backend.app.scripts.smoke_demo
      - if: always()
        run: docker compose down -v

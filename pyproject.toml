[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Permission-aware enterprise knowledge assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.29,<1", "alembic>=1.13,<2",
  "pgvector>=0.3,<1", "arq>=0.26,<1", "redis>=5,<6", "python-multipart>=0.0.12,<1",
  "argon2-cffi>=23,<26", "PyJWT>=2.9,<3", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "anthropic>=0.40,<1", "openai>=1.50,<3",
  "structlog>=24,<26", "prometheus-client>=0.21,<1", "tenacity>=9,<10", "tiktoken>=0.8,<1",
  "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2", "opentelemetry-exporter-otlp>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1", "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1",
  "python-magic>=0.4.27,<1", "email-validator>=2.2,<3"
]

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.7,<1", "mypy>=1.13,<2", "aiosqlite>=0.20,<1", "testcontainers[postgres]>=4.8,<5", "pip-audit>=2.7,<3"]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3.2,<4"]
cross-encoder = ["sentence-transformers>=3.2,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["frontend"]

